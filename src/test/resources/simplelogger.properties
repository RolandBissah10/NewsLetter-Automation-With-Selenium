# Control SLF4J SimpleLogger output for test runs
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss
# Log to file
org.slf4j.simpleLogger.logFile=target/test-execution.log
# Reduce noisy Selenium-level logs
org.slf4j.simpleLogger.log.org.openqa.selenium=warn

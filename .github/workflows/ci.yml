name: CI - Selenium tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      simulate:
        description: 'Set to "true" to simulate a failing run'
        required: false
        default: 'false'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Maven tests
        env:
          CI: true
        run: |
          set -o pipefail
          mvn -B -Dheadless=true test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

      - name: Simulate failure (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.simulate == 'true' }}
        run: |
          echo "Simulating a failing CI job"
          exit 1

  notify:
    needs: build-and-test
    if: always()
    runs-on: ubuntu-latest

    steps:

      # 🔔 Slack Notification
      - name: Send Slack Notification
        run: |
          STATUS="${{ needs.build-and-test.result }}"

          if [ "$STATUS" = "success" ]; then
            MESSAGE="✅ Tests Passed"
          else
            MESSAGE="❌ Tests Failed"
          fi

          curl -X POST -H "Content-Type: application/json" \
          --data "{\"text\":\"$MESSAGE\nRepository: ${{ github.repository }}\nRun #: ${{ github.run_number }}\nWorkflow: ${{ github.workflow }}\nDetails: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
          ${{ secrets.SLACK_WEBHOOK_URL }}

      # Email - Success
      - name: Email notification — success
        if: needs.build-and-test.result == 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "CI SUCCESS - ${{ github.repository }} (Run #${{ github.run_number }})"
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: ${{ secrets.NOTIFY_EMAIL_FROM }}
          body: |
            Build Status: SUCCESS

            Repository: ${{ github.repository }}
            Run Number: ${{ github.run_number }}
            Workflow: ${{ github.workflow }}

            View Run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # Email - Failure
      - name: Email notification — failure
        if: needs.build-and-test.result != 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "CI FAILED - ${{ github.repository }} (Run #${{ github.run_number }})"
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: ${{ secrets.NOTIFY_EMAIL_FROM }}
          body: |
            Build Status: FAILED

            Repository: ${{ github.repository }}
            Run Number: ${{ github.run_number }}
            Workflow: ${{ github.workflow }}

            View Run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

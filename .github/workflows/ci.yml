name: CI - Selenium tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      simulate:
        description: 'Set to "true" to simulate a failing run (useful to test failure notifications)'
        required: false
        default: 'false'
      test_email:
        description: 'Set to "true" to send a test email during a manual run'
        required: false
        default: 'false'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Runner / browser diagnostics
        run: |
          echo "--- environment ---"
          uname -a || true
          java -version || true
          mvn -v || true
          echo "--- chrome / driver ---"
          google-chrome --version || google-chrome-stable --version || chromium --version || echo "chrome not found"
          chromedriver --version || echo "chromedriver not found"

      - name: Run Maven tests (capture log)
        id: mvn-test
        env:
          CI: true
        run: |
          set -o pipefail
          mvn -B -Dheadless=true test | tee mvn.log

      - name: Upload Maven log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mvn-log
          path: mvn.log

      - name: Simulate failure (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.simulate == 'true' }}
        run: |
          echo "Simulating a failing CI job as requested (workflow_dispatch simulate=true)"
          exit 1

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  notify:
    needs: build-and-test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Send notifications
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          python .github/scripts/notify.py "${{ needs.build-and-test.result }}"
        continue-on-error: true

name: CI - Selenium tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      simulate:
        description: 'Set to "true" to simulate a failing run (useful to test failure notifications)'
        required: false
        default: 'false'
      test_email:
        description: 'Set to "true" to send a test email during a manual run'
        required: false
        default: 'false'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Maven tests
        id: mvn-test
        env:
          CI: true
        run: mvn -B -Dheadless=true test

      - name: Simulate failure (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.simulate == 'true' }}
        run: |
          echo "Simulating a failing CI job as requested (workflow_dispatch simulate=true)"
          exit 1

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

      - name: Check notification secrets
        id: check-notifications
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK }}" ]; then echo "slack=true" >> $GITHUB_OUTPUT; else echo "slack=false" >> $GITHUB_OUTPUT; fi
          if [ -n "${{ secrets.SMTP_SERVER }}" ] && [ -n "${{ secrets.NOTIFY_EMAIL_TO }}" ]; then echo "email=true" >> $GITHUB_OUTPUT; else echo "email=false" >> $GITHUB_OUTPUT; fi

      - name: Slack — success
        if: success() && steps.check-notifications.outputs.slack == 'true'
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {"text":"✅ Tests passed for ${{ github.repository }} (#${{ github.run_number }})\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View details>"}

      - name: Slack — failure
        if: failure() && steps.check-notifications.outputs.slack == 'true'
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {"text":"❌ Tests failed for ${{ github.repository }} (#${{ github.run_number }})\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View details>"}

      - name: Send test email (manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.test_email == 'true' && steps.check-notifications.outputs.email == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "CI test email — run #${{ github.run_number }}"
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: ${{ secrets.NOTIFY_EMAIL_FROM }}
          body: "This is a test email from the CI workflow (workflow_dispatch input test_email=true)."

      - name: Email notification (optional)
        if: steps.check-notifications.outputs.email == 'true'
        uses: dawidd6/action-send-mail@v3W
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "CI ${{ github.repository }} (run #${{ github.run_number }}) - ${{ job.status }}"
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: ${{ secrets.NOTIFY_EMAIL_FROM }}
          body: "Build result: ${{ job.status }}. View run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ignore_cert: true

name: Slack Notification

on:
  workflow_call:
    inputs:
      status:
        required: true
        type: string
      tests_total:
        required: false
        type: string
        default: 'N/A'
      tests_passed:
        required: false
        type: string
        default: 'N/A'
      tests_failed:
        required: false
        type: string
        default: 'N/A'
      tests_skipped:
        required: false
        type: string
        default: 'N/A'
      failed_tests:
        required: false
        type: string
        default: ''
    secrets:
      SLACK_WEBHOOK_URL:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Jinja2
        run: pip install jinja2 --break-system-packages

      - name: Render Slack Payload
        env:
          STATUS:        ${{ inputs.status }}
          TESTS_TOTAL:   ${{ inputs.tests_total }}
          TESTS_PASSED:  ${{ inputs.tests_passed }}
          TESTS_FAILED:  ${{ inputs.tests_failed }}
          TESTS_SKIPPED: ${{ inputs.tests_skipped }}
          REPOSITORY:    ${{ github.repository }}
          BRANCH:        ${{ github.ref_name }}
          RUN_NUMBER:    ${{ github.run_number }}
          COMMIT:        ${{ github.sha }}
          RUN_URL:       ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/render_slack.py

      - name: Send Slack Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST \
               -H "Content-Type: application/json" \
               --data @/tmp/slack_payload.json \
               "$SLACK_WEBHOOK_URL"
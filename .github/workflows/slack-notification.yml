name: Slack Notification

on:
  workflow_call:
    inputs:
      status:
        required: true
        type: string
      tests_total:
        required: false
        type: string
        default: 'N/A'
      tests_passed:
        required: false
        type: string
        default: 'N/A'
      tests_failed:
        required: false
        type: string
        default: 'N/A'
      tests_skipped:
        required: false
        type: string
        default: 'N/A'
      failed_tests:
        required: false
        type: string
        default: ''
    secrets:
      SLACK_WEBHOOK_URL:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Slack Notification - Success
        if: inputs.status == 'success'
        uses: slackapi/slack-github-action@v1.24.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        with:
          payload: |
            {
              "text": "✅ All tests passed — ${{ github.repository }} (#${{ github.run_number }})",
              "attachments": [
                {
                  "color": "good",
                  "fields": [
                    {
                      "title": "Repository",
                      "value": "${{ github.repository }}",
                      "short": true
                    },
                    {
                      "title": "Branch",
                      "value": "${{ github.ref_name }}",
                      "short": true
                    },
                    {
                      "title": "Commit",
                      "value": "${{ github.sha }}",
                      "short": true
                    },
                    {
                      "title": "Run #",
                      "value": "${{ github.run_number }}",
                      "short": true
                    },
                    {
                      "title": "Test Results",
                      "value": "Total: ${{ inputs.tests_total }}  |  ✅ Passed: ${{ inputs.tests_passed }}  |  ❌ Failed: ${{ inputs.tests_failed }}  |  ⏭ Skipped: ${{ inputs.tests_skipped }}",
                      "short": false
                    },
                    {
                      "title": "View Run",
                      "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open in GitHub Actions>",
                      "short": false
                    }
                  ]
                }
              ]
            }

      - name: Slack Notification - Failure
        if: inputs.status == 'failure'
        uses: slackapi/slack-github-action@v1.24.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        with:
          payload: |
            {
              "text": "❌ Tests FAILED — ${{ github.repository }} (#${{ github.run_number }})",
              "attachments": [
                {
                  "color": "danger",
                  "fields": [
                    {
                      "title": "Repository",
                      "value": "${{ github.repository }}",
                      "short": true
                    },
                    {
                      "title": "Branch",
                      "value": "${{ github.ref_name }}",
                      "short": true
                    },
                    {
                      "title": "Commit",
                      "value": "${{ github.sha }}",
                      "short": true
                    },
                    {
                      "title": "Run #",
                      "value": "${{ github.run_number }}",
                      "short": true
                    },
                    {
                      "title": "Test Results",
                      "value": "Total: ${{ inputs.tests_total }}  |  ✅ Passed: ${{ inputs.tests_passed }}  |  ❌ Failed: ${{ inputs.tests_failed }}  |  ⏭ Skipped: ${{ inputs.tests_skipped }}",
                      "short": false
                    },
                    {
                      "title": "❌ Failed Tests",
                      "value": "```${{ inputs.failed_tests != '' && inputs.failed_tests || 'No failure details available' }}```",
                      "short": false
                    },
                    {
                      "title": "View Full Logs",
                      "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Open in GitHub Actions>",
                      "short": false
                    }
                  ]
                }
              ]
            }

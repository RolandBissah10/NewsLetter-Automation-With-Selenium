name: Email Notification

on:
  workflow_call:
    inputs:
      status:
        required: true
        type: string
      tests_total:
        required: false
        type: string
        default: 'N/A'
      tests_passed:
        required: false
        type: string
        default: 'N/A'
      tests_failed:
        required: false
        type: string
        default: 'N/A'
      tests_skipped:
        required: false
        type: string
        default: 'N/A'
      failed_tests:
        required: false
        type: string
        default: ''
    secrets:
      SMTP_SERVER:
        required: true
      SMTP_PORT:
        required: true
      SMTP_USERNAME:
        required: true
      SMTP_PASSWORD:
        required: true
      NOTIFY_EMAIL_TO:
        required: true
      NOTIFY_EMAIL_FROM:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Jinja2
        run: pip install jinja2 --break-system-packages

      - name: Render Email Template
        env:
          STATUS:        ${{ inputs.status }}
          TESTS_TOTAL:   ${{ inputs.tests_total }}
          TESTS_PASSED:  ${{ inputs.tests_passed }}
          TESTS_FAILED:  ${{ inputs.tests_failed }}
          TESTS_SKIPPED: ${{ inputs.tests_skipped }}
          REPOSITORY:    ${{ github.repository }}
          BRANCH:        ${{ github.ref_name }}
          RUN_NUMBER:    ${{ github.run_number }}
          COMMIT:        ${{ github.sha }}
          RUN_URL:       ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/render_email.py

      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port:    ${{ secrets.SMTP_PORT }}
          username:       ${{ secrets.SMTP_USERNAME }}
          password:       ${{ secrets.SMTP_PASSWORD }}
          subject:        "[${{ inputs.status == 'success' && 'PASSED' || 'FAILED' }}] CI #${{ github.run_number }} — ${{ github.repository }} (${{ github.ref_name }})"
          to:             ${{ secrets.NOTIFY_EMAIL_TO }}
          from:           ${{ secrets.NOTIFY_EMAIL_FROM }}
          html_body:      file:///tmp/email_body.html